name: Apple app

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The app's minimum is iOS 17 / Swift 5.10. macos-14 exercises that
    # compatibility floor and has substantially better hosted-runner capacity
    # than the macos-15 pool.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Prove generated project is current
        working-directory: ios
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- FrankenJazz.xcodeproj Sources/Info.plist
      - name: Build for iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild -project FrankenJazz.xcodeproj -scheme FrankenJazz
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Run Mac Catalyst unit tests
        working-directory: ios
        run: >-
          xcodebuild -project FrankenJazz.xcodeproj -scheme FrankenJazz
          -destination 'platform=macOS,variant=Mac Catalyst'
          CODE_SIGNING_ALLOWED=NO test -only-testing:FrankenJazzTests
