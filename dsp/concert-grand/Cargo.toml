[package]
name = "concert-grand"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Deterministic rendered-piano and spectrum-analysis DSP core for Changes (compiled to wasm32-unknown-unknown and embedded in the standalone artifact)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Software float transcendentals: identical results on every host and in
# every browser, which is what lets the PCM goldens pin exact hashes.
libm = "0.2"

[profile.release]
# O2 is both smaller and faster for this export-heavy no_std WASM after the
# pinned Binaryen -Oz pass. O3 over-inlines the physical renderers: on the
# four-note PLK2 browser chord it produced 158842 bytes / 39.05 ms versus
# 147002 bytes / 28.55 ms at O2, with byte-identical PCM.
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
