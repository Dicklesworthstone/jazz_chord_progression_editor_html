name: FrankenJazz
options:
  bundleIdPrefix: com.frankenjazz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: AU8V2Z6NKY
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

schemes:
  FrankenJazz:
    build:
      targets:
        FrankenJazz: all
        FrankenJazzTests: [test]
        FrankenJazzUITests: [test]
    test:
      targets:
        - FrankenJazzTests
        - FrankenJazzUITests

targets:
  FrankenJazz:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankenjazz.FrankenJazz
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: false
        MACCATALYST_USE_NATIVE_DESIGN: true
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/FrankenJazz.entitlements
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FrankenJazz
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: FrankenJazz Chart
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.frankenjazz.chart
          - CFBundleTypeName: Lead-sheet text, JSON, or MIDI
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.json
              - public.midi-audio
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.json
            UTTypeDescription: FrankenJazz Chart
            UTTypeIdentifier: com.frankenjazz.chart
            UTTypeTagSpecification:
              public.filename-extension:
                - frankenjazz
              public.mime-type: application/vnd.frankenjazz.chart+json
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  FrankenJazzTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    sources:
      - path: Tests
    dependencies:
      - target: FrankenJazz
  FrankenJazzUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: FrankenJazz
    sources:
      - path: UITests
    dependencies:
      - target: FrankenJazz
